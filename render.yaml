services:
  - type: web
    name: app-transp-dashboard
    runtime: node
    rootDir: dashboard
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DASHBOARD_SESSION_SECRET
        sync: false
      - key: MOCK_SERVER_URL
        sync: false
      # DASHBOARD_ADMIN_PASSWORD quitada (2026-09-11): reemplazada por la
      # tabla `admins` (contraseña individual por administrador, ver
      # supabase/schema_v7_admins.sql y contexto_proyecto.md §4).

  - type: web
    name: app-transp-mock-server
    runtime: node
    rootDir: server/mock
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
